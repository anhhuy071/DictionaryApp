{% extends "layout.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <span class="app-brand-icon auth-logo"><i class="bi bi-book-half"></i></span>
      <h1>Welcome back</h1>
      <p>Log in to save words and track your progress.</p>
    </div>
    <form action="/login" method="post" class="auth-form">
      <label class="auth-field">
        <span>Username</span>
        <input name="username" class="form-control" placeholder="Your username" type="text" required>
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input name="email" class="form-control" placeholder="you@email.com" type="email" required>
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input name="password" class="form-control" placeholder="••••••••" type="password" required>
      </label>
      <button type="submit" class="btn app-btn-primary auth-submit">Log in</button>
      <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
    </form>
  </div>
</section>
{% endblock %}
