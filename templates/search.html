{% extends "layout.html" %}

{% block title %}Search{% endblock %}

{% block content %}
<section class="page-shell page-shell-narrow">
  <div class="page-header">
    <h1 class="page-title">Search dictionary</h1>
    <p class="page-subtitle">English → Vietnamese</p>
  </div>

  <form class="hero-search" action="{{ url_for('search') }}" method="get">
    <div class="hero-search-box">
      <i class="bi bi-search hero-search-icon"></i>
      <input name="q" class="hero-search-input" placeholder="Type an English word…" type="search" value="{{ q or '' }}" required autofocus>
      <button type="submit" class="hero-search-btn">Search</button>
    </div>
  </form>
</section>
{% endblock %}
