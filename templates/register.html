{% extends "layout.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <span class="app-brand-icon auth-logo"><i class="bi bi-book-half"></i></span>
      <h1>Create account</h1>
      <p>Sign up to build vocabulary lists and study with flashcards.</p>
    </div>
    <form action="/register" method="post" class="auth-form">
      {% if message %}
      <div class="auth-alert">{{ message }}</div>
      {% endif %}
      <label class="auth-field">
        <span>Username</span>
        <input class="form-control" name="username" type="text" required>
      </label>
      <label class="auth-field">
        <span>Full name</span>
        <input class="form-control" name="full_name" type="text" required>
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input class="form-control" name="email" type="email" placeholder="you@email.com" required>
      </label>
      <label class="auth-field">
        <span>Password</span>
        <input class="form-control" name="password1" type="password" placeholder="••••••••" required>
      </label>
      <label class="auth-field">
        <span>Confirm password</span>
        <input class="form-control" name="password2" type="password" placeholder="••••••••" required>
      </label>
      <button class="btn app-btn-primary auth-submit" type="submit">Create account</button>
      <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
  </div>
</section>
{% endblock %}
