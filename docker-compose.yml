services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dictionary
      POSTGRES_PASSWORD: dictionary
      POSTGRES_DB: dictionary
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tables.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictionary -d dictionary"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://dictionary:dictionary@db:5432/dictionary
      SECRET_KEY: change-me-in-production
      SESSION_FILE_DIR: /app/flask_session
    volumes:
      - flask_sessions:/app/flask_session
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  flask_sessions:
